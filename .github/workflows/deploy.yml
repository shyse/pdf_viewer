name: Deploy PDF Viewer

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. cloudflared のインストール
      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      # 2. SSHキーの設定と SSH Config の構成 (Cloudflare Tunnel 連携)
      - name: Setup SSH config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # SSH Config に Cloudflare Tunnel の ProxyCommand を設定し、Service Token で認証をバイパス
          cat <<EOF > ~/.ssh/config
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CF_CLIENT_ID }} --service-token-secret ${{ secrets.CF_CLIENT_SECRET }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
          EOF

      # 3. SCP を使用したファイル転送
      - name: Deploy file
        run: |
          scp pdf-viewer.html ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/opt/docker/static-app/html/pdf_viewer/
